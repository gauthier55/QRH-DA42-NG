<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">

<body>
<title>DA42 NG QRH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the Diamond paper checklist on a tablet. Desk-grey ground, white "paper" pages, Verdana, dotted leaders,
   red dashed frame for Emergency, orange for Abnormal, navy for data. Index ↔ page; two panes on wide screens. */
:root{
  --desk:#e4e7eb; --paper:#ffffff; --ink:#111418; --dim:#59616c; --rule:#c4cad3;
  --navy:#111418; --red:#e1141c; --redfill:#ff5c5c; --orange:#f08c00; --orangefill:#ffc266;
  --green:#178a3c; --hl:#fff1a6; --cyanfill:#cdf4fa; --greyfill:#e7e7e7; --magenta:#e51ce5; --pinkfill:#ff9fd0; --onfill:#111418;
  --font:Verdana,Geneva,"DejaVu Sans",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --desk:#070b12; --paper:#101722; --ink:#e7ebf1; --dim:#98a3b3; --rule:#2a3546;
  --navy:#e7ebf1; --red:#ff5a5a; --redfill:#a3262a; --orange:#ffa733; --orangefill:#8a5208;
  --green:#4fd67f; --hl:#3a3410; --cyanfill:#123f48; --greyfill:#1b2331; --magenta:#f06cf0; --pinkfill:#5a2246; --onfill:#ffffff; color-scheme:dark}
html,body{min-height:100%}
html{touch-action:manipulation}
body{background:var(--desk);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[data-i]:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
main{margin-top:calc(var(--hh,170px) - env(safe-area-inset-top,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-weight:700;font-style:italic;font-size:18px;letter-spacing:.01em}
.brand b{color:var(--red);font-style:normal;margin-left:4px}
.ed{font-size:11px;color:var(--red);font-style:italic;margin-top:2px}
.sp{flex:1}
.ibtn.evac{background:var(--red);border-color:var(--red);color:#fff;font-size:14px;padding:8px 16px;letter-spacing:.06em}
.ibtn{border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--dim);min-height:40px;background:var(--paper)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:10px}
.tab{border:2px solid var(--tc);border-radius:6px;padding:10px 2px;font-weight:700;font-size:12.5px;color:var(--tc);min-height:46px;background:var(--paper)}
.tab[aria-selected="true"]{background:var(--tc);color:#fff}
.tab.N{--tc:var(--ink)}.tab.E{--tc:var(--red)}.tab.A{--tc:var(--orange)}.tab.L{--tc:var(--magenta)}
:root[data-theme="dark"] .tab.N[aria-selected="true"]{color:var(--paper)}
.search{padding-bottom:10px}
.search input{width:100%;background:var(--desk);border:1px solid var(--rule);border-radius:6px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink)}

main{display:grid;grid-template-columns:1fr}
@media (min-width:900px){main{grid-template-columns:340px 1fr}#idx{border-right:1px solid var(--rule);height:calc(100vh - var(--hh,170px));height:calc(100dvh - var(--hh,170px));overflow:auto;position:sticky;top:var(--hh,170px);-webkit-overflow-scrolling:touch}#back{display:none!important}}
@media (max-width:899px){main.reading #idx{display:none}main:not(.reading) #view{display:none}}

#idx{padding-block:6px 40px}
.gh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;padding:13px 12px;min-height:52px;background:var(--paper);border:2px solid var(--gc);border-radius:4px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.gh .chev{width:18px;flex:none;color:var(--gc);transition:transform .15s}
.gh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.gh[aria-expanded="true"]{background:var(--greyfill)}
.gh .gn{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0;white-space:nowrap}
.gh .gn.ok{color:var(--green);font-weight:700}
.gh.N{--gc:var(--ink)}.gh.E{--gc:var(--red)}.gh.A{--gc:var(--orange)}.gh.L{--gc:var(--magenta)}
.gbody{padding-left:16px;border-left:2px dotted var(--rule);margin-left:20px;padding-bottom:4px}
.grp{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:18px 2px 6px;font-style:italic}
.cl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);margin-top:6px;min-height:52px}
.cl .t{font-weight:700;font-size:14.5px;line-height:1.3}
.cl .s{font-size:12px;color:var(--dim);margin-top:2px}
.cl .mk{width:5px;align-self:stretch;flex:none}
.cl.E .mk{background:repeating-linear-gradient(var(--red) 0 6px,transparent 6px 10px)}
.cl.A .mk{background:repeating-linear-gradient(var(--orange) 0 6px,transparent 6px 10px)}
.cl.N .mk{background:var(--ink)}.cl.L .mk{background:var(--magenta)}
.cl .pr{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}
.cl .pr.ok{color:var(--green);font-weight:700}
.cl[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.empty{color:var(--dim);padding:24px 0}

#view{min-width:0;padding-top:12px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.page{background:var(--paper);max-width:860px;margin:0 auto;border:1px solid var(--rule);padding:14px 14px 18px}
.page.E{border:5px dashed var(--red)}
.page.A{border:5px dashed var(--orange)}
.runhead{display:flex;justify-content:space-between;gap:10px;border:2px solid var(--ink);padding:5px 8px;font-weight:700;font-style:italic;font-size:12.5px}
.page.E .runhead{background:var(--red);border-color:var(--red);color:#fff}
.page.A .runhead{background:var(--orange);border-color:var(--orange);color:#fff}
.ttl{text-align:center;margin:18px 0 6px}
h1{display:inline-block;font-size:21px;line-height:1.25;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em;padding:4px 10px}
.page.E h1{background:var(--redfill);border:2px solid var(--ink);color:var(--onfill)}
.page.A h1{background:var(--orangefill);border:2px solid var(--ink);color:var(--onfill)}
.page.N h1,.page.L h1{text-decoration:underline;text-underline-offset:5px}
.vsub{text-align:center;color:var(--dim);font-size:13.5px;font-style:italic}
.prog{height:5px;background:var(--greyfill);margin:14px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .2s}

.items{padding-block:6px 4px}
.it{display:flex;align-items:baseline;gap:8px;padding:10px 6px;border-radius:3px;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:46px;position:relative}
.it .n{font-size:14px;width:24px;text-align:right;flex:none}
.it .n2{text-align:left;width:22px}
.it .c{min-width:0;font-size:17px;line-height:1.3}
.it .d{flex:1;border-bottom:2px dotted var(--ink);opacity:.55;min-width:14px;transform:translateY(-4px)}
.it .r{font-size:16px;text-align:right;max-width:52%;text-transform:none}
.it .k{width:22px;flex:none;text-align:center;font-weight:700;color:var(--green);font-size:18px}
.it.done .c,.it.done .r,.it.done .n{color:var(--green)}
.it.done .r{font-weight:700}
.it.done .k::before{content:"✓"}
.it.act{background:var(--hl);box-shadow:inset 0 0 0 1px var(--orange)}
.it .tg{font-size:10px;font-weight:700;border:1px solid var(--dim);color:var(--dim);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}
.cond{display:flex;gap:8px;font-weight:700;font-size:16px;padding:12px 6px 4px;line-height:1.35;padding-left:calc(6px + var(--ind,0px))}
.note{color:var(--ink);font-size:15px;padding:6px 6px 6px 38px;line-height:1.4;text-align:left}
.note.cen{text-align:center;padding-left:6px}
.caut{border:2px solid var(--orange);border-radius:0;padding:9px 12px;margin:10px 6px;font-size:15px;line-height:1.4;font-weight:700;font-style:italic;text-align:center}
.sub{font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:4px;padding:16px 6px 4px}
.lnk{display:inline-flex;align-items:center;gap:8px;margin:6px 6px 6px 38px;padding:9px 14px;border:2px solid var(--navy);color:var(--navy);border-radius:4px;font-weight:700;font-size:14.5px;min-height:44px;background:var(--paper)}
.l1{margin-left:22px}.l2{margin-left:44px}.l3{margin-left:66px}
.cond.l1,.cond.l2,.cond.l3{margin-left:0}
.done-banner{margin:14px 6px 4px;padding:10px;border:2px solid var(--green);color:var(--green);text-align:center;font-weight:700;letter-spacing:.06em}
.resetall{display:block;width:100%;max-width:860px;margin:22px auto 0;min-height:56px;border:2px solid var(--rc);color:var(--rc);background:var(--paper);font-weight:700;font-size:14px;border-radius:4px}
.resetall.N{--rc:var(--ink)}.resetall.E{--rc:var(--red)}.resetall.A{--rc:var(--orange)}
.resetall.ok{border-style:solid;border-color:var(--green);color:var(--green)}
.foot-note{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;font-style:italic;margin-top:18px;border-top:1px solid var(--rule);padding-top:8px}
.foot-note .x{color:var(--red);font-weight:700}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--rule);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
@media (min-width:900px){.foot{left:340px}}
.fb{border:2px solid var(--rule);border-radius:6px;font-weight:700;font-size:13px;min-height:60px;padding:0 14px;background:var(--paper)}
.fb.main{flex:1;background:var(--navy);border-color:var(--navy);color:#fff;font-size:15px;text-transform:uppercase}
:root[data-theme="dark"] .fb.main{color:var(--paper)}
.fb.main.fin{background:var(--green);border-color:var(--green)}
.fb.warn{color:var(--red);border-color:var(--red)}
.fb.all{border-style:dashed;line-height:1.15}
.fb.ok{color:var(--green);border-color:var(--green);border-style:solid}
.fb.undo{color:var(--navy);border-color:var(--navy)}

.tblw{overflow-x:auto;margin:8px 0 16px}
table{border-collapse:collapse;font-size:14px;width:100%;min-width:460px;border:2px solid var(--ink)}
th,td{border:1px solid var(--ink);padding:7px 8px;text-align:left;vertical-align:middle}
thead th{font-size:12px;font-weight:700;background:var(--paper)}
th.sec{background:var(--greyfill);text-align:center;font-size:13px}
td{background:var(--greyfill)}
td.v{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:400}
.d6{background:var(--cyanfill)!important}
.sf{outline:3px solid var(--green);outline-offset:-3px}
th.mass{background:var(--magenta);color:#fff}
td.pink{background:var(--pinkfill)}
td.plain,th.plain{background:var(--paper)}
.r1{color:var(--red);font-weight:700}.y1{color:var(--orange);font-weight:700}.g1{color:var(--green);font-weight:700}
.seg{display:flex;justify-content:center;margin:10px 0 2px}
.seg>div{display:inline-flex;border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.seg button{padding:9px 16px;font-size:13px;font-weight:700;color:var(--navy);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.lim h2{font-size:14px;font-weight:700;text-transform:uppercase;margin:22px 0 4px;color:var(--ink)}
.lim p{color:var(--dim);font-size:13.5px;margin:6px 0;max-width:68ch;line-height:1.45}
.pager{display:flex;justify-content:center;gap:6px;max-width:860px;margin:0 auto 10px}
.pager button{flex:1;min-height:42px;border:2px solid var(--magenta);border-radius:4px;background:var(--paper);color:var(--magenta);font-weight:700;font-size:12.5px;padding:6px 8px}
.pager button[aria-selected="true"]{background:var(--magenta);color:#fff}
.swipe{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.swipe::-webkit-scrollbar{display:none}
.swipe>.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:0 2px}
.src{font-size:12px;color:var(--dim);font-style:italic;text-align:center;margin-top:6px}
@media (max-width:560px){.page{padding:10px 8px 14px}.page.E,.page.A{border-width:4px}.it{flex-wrap:wrap;padding-right:30px}.it .c{font-size:16px;flex:1}.it .d,.it .n2{display:none}.it .r{flex-basis:100%;text-align:left;max-width:none;padding-left:32px}.it .k{position:absolute;right:6px;top:10px}}
@media (max-width:520px){.tab{font-size:10px;letter-spacing:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header id="hdr">
  <div class="bar gut">
    <button id="back" class="ibtn" hidden>‹ INDEX</button>
    <div><div class="brand">DA42 NG-VI NXI<b>QRH</b></div><div class="ed">Edition # 1.1 · 15.05.2020 · Does not replace the AFM · <b>app v6</b></div></div>
    <div class="sp"></div>
    <button id="evac" class="ibtn evac" data-id="evac">EVAC</button>
    <button id="theme" class="ibtn" aria-label="Changer de thème">NUIT</button>
  </div>
  <div class="tabs gut" role="tablist">
    <button class="tab N" data-t="N" role="tab">NORMAL</button>
    <button class="tab E" data-t="E" role="tab">EMERGENCY</button>
    <button class="tab A" data-t="A" role="tab">ABNORMAL</button>
    <button class="tab L" data-t="L" role="tab">LIMITS</button>
  </div>
  <div class="search gut"><input id="q" type="search" placeholder="Rechercher : fire, ECU, gear, VYSE…" autocomplete="off" autocorrect="off" spellcheck="false"></div>
</header>

<main id="main">
  <nav id="idx" class="gut" aria-label="Index des checklists"></nav>
  <section id="view" class="gut"></section>
</main>


<script>
/* ---------- CHECKLIST DATA (transcribed from Diamond Flight Training, DA42 NG-VI NXI, Ed. 1.1, 15.05.2020) ----------
   Syntax:  "- Challenge | RESPONSE" numbered item · "-7 ..." item with explicit number · ". ..." unnumbered check
            "> ..." condition · "~ ..." note · "! ..." caution · "= ..." sub-header · "@id Label" link · "%table" table
            leading "*" = if ice protection installed, "**" = if AUX tanks installed · 2 spaces = one indent level        */
const CL = [
/* ===================== NORMAL ===================== */
{id:"pre-int",s:"N",g:"Preflight",t:"Preflight Interior + Exterior",src:`
~ * if ice protection installed · ** if AUX tanks installed
- Airplane documents | CHECK
- Pitot cover | REMOVE
- Interior: foreign or loose objects | CHECK
- Circuit breakers | CHECK
- Start key | PULLED OUT
- Gear selector | CHECKED DOWN
- Electric Master | ON
  ~ Check battery voltage
- Gear 3 greens | CHECKED
- Fuel quantity + temp | CHECK
- **AUX PUMPS (2) | ON
  > If AUX FUEL E caution ON: AUX tank(s) empty
    . **AUX PUMPS (2) | OFF
- External lights | ON
- Parking brake | SET
- Pitot heat | ON
- *De-ice fluid quantity | CHECK
- *De-ice pump | SELECT 1
- *De-ice | HIGH/MAX
- *DEIC PRES LO + HI | CHECK OUT
- *De-ice pump | SELECT 2
- *DEIC PRES LO + HI | CHECK OUT
- *Ice lights | ON
- *De-ice function | CHECK
- External lights | CHECK
- Stall warning | CHECK
- Pitot tube heat | CHECK
- Pitot heat | OFF
- External lights | OFF
- *De-ice, ice lights | OFF
- Electric Master | OFF`},
{id:"pre-ext",s:"N",g:"Preflight",t:"Preflight Exterior",src:`
. Canopy left side
= Left main gear
. Strut (min 4 cm bare piston) & downlock
. Tire condition, pressure (4,5 bar), position mark
. Brake, hydraulic line
. Gear door & linkage
= Left engine nacelle
. Drain gascolator and sample check
. 2 / 3 air inlets
. Spinner, propeller
. Gearbox oil level
. Engine oil level
. Cowling
. Nacelle underside
. Venting pipe
. Exhaust
. **Check AUX tank full
= Left wing
. Vortex generators
. Wing leading edge, top and bottom surface
. Tank drain and sample check
. Stall warning
. Tank air vent
. Fuel filler cap
. Pitot probe (cover removed)
. Wing tip, position light
. Static dischargers
. Aileron (freedom of movement, hinges, control linkage, covers if DA42)
. Wing flap – hinge pin (covers)
. Fuel cooler air in- & outlet
. 2 air outlets
. **AUX tank vent
. **AUX tank drain and sample check
= Left fuselage
. Step
. Rear cabin door
. Fuselage left side
. Static source
. Antennas
! Attention! For use of fuel additives see AFM
= Tail
. Elevator & rudder (freedom of movement, hinges)
. Elevator & rudder trim tabs
. Tail skid & lower fin
. Static dischargers
= Right fuselage
. Fuselage right side
. Static source
. Rear window
. Step
= Right wing
. Fuel cooler air in- & outlet
. **AUX tank vent
. **Drain AUX tank
. Wing flap
. Aileron (freedom of movement, hinges, control linkage, security)
. Static dischargers
. Wing tip, position light
. Wing leading edge, top and bottom surface
. Fuel filler cap
. Tank air vent
. Tank drain
. Cabin air vent inlet
. Vortex generators
. Canopy right side
= Right engine nacelle
. **Check AUX tank full
. 3 air inlets / 2 air outlets
. Spinner, propeller
. Gearbox oil level
. Engine oil level
. Cowling
. Nacelle underside
. Venting pipe
. Exhaust
. Drain gascolator
. Ventilation air inlet
= Right main gear
. Strut (min 4 cm bare piston) & downlock
. Tire condition, pressure (4,5 bar), position mark
. Brake, hydraulic line
. Gear door & linkage
= Nose section
. *De-ice fluid tank
. L + R front baggage door locked
. OAT sensor
. EPU connection
. Landing / Taxi light
= Nose gear
. Strut (min 15 cm bare piston) & lock
. Tire condition, pressure (6 bar), position mark
. Gear door & linkage
. Chocks removed
. Tow bar removed`},
{id:"bef-start",s:"N",g:"Ground",t:"Check Before Engine Start",src:`
~ Items 1 to 23 may be completed by heart. Complete them on the paper checklist before using the G1000 electronic checklist.
- Preflight check | COMPLETED
- Baggage and tow bar | SECURED
- **AUX PUMPS (2) | OFF
- Fuel selectors (2) | ON, safety guard closed
- Power levers (2) | IDLE
- Parking brake | SET
- Alternate air | CLOSED
- Fuel pumps (2) | OFF
- Manual gear extension handle | PUSHED
- Gear selector | DOWN
- Avionic master | OFF
- Electric master | OFF
- Engine masters (2) | OFF
- Pitot heat | OFF
- Alternate static | CLOSED
- Alternators (2) | ON
- VOTER switches (2) | AUTO
- All light switches | OFF
- Emergency switch | OFF/GUARDED
- ELT | ARMED
- Circuit breakers | CHECKED IN
- Flap selector | UP
> If starting with external power:
  . Prop area | CHECK CLEAR
  . External power | CONNECT
- Electric master | ON
- Rudder pedals | ADJUSTED
- Flight controls | CHECKED
- Trims | CHECKED
- Gear warning + lights, fire detector | TEST
- *De-ice ANNUN TEST | ON
- *DEICE LVL LO caution | CHECKED ON if applic.
- *Windshield de-icing | PUMP 1 + 2 CHECKED
- Flaps full travel → LDG → UP | CHECKED
- Variable elevator stop | CHECK
  . Control stick | AFT and HOLD
  . Power levers | MAX
  ~ Check stop limit decreasing
  . Power levers | IDLE
  ~ Check stop limit increasing
- Passengers | INSTRUCTED
- Seat belts | FASTENED
- Rear door | CLOSED and LATCHED
- Front canopy | POS 1 or 2
- G1000 | POWERED, ACKNOWLEDGED
- MFD – EIS | ENGINE
- Fuel quantity | CHECKED, RESET/SET if requ.
- Fuel temperature | CHECKED
- Total time in service | NOTED
- *DEIC PRESS LO caution | CHECKED ON
- *De-ice ANNUN TEST | OFF
- Start key | INSERTED
- Power levers (2) | IDLE
- ACL (strobe) | ON`},
{id:"eng-start",s:"N",g:"Ground",t:"Engine Start Procedure",sub:"Normal sequence: LH engine first",src:`
= LH engine
. Propeller area | CLEAR
. Engine Master | ON
. Annunciations / Eng. Instr. | CHECKED
. Glow indication | OFF
. Start key | START
. Oil pressure | OUTSIDE RED within 3 sec
. Voltage, electrical load | CHECK INDICATION
. Annunciations / Eng. Instr. | CHECK
= RH engine
. Propeller area | CLEAR
. Engine Master | ON
. Annunciations / Eng. Instr. | CHECKED
. Glow indication | OFF
. Start key | START
. Oil pressure | OUTSIDE RED within 3 sec
. Voltage, electrical load | CHECK INDICATION
. Annunciations / Eng. Instr. | CHECK
> If external power was used:
  . External power | DISCONNECT`},
{id:"aft-start",s:"N",g:"Ground",t:"Check After Engine Start",src:`
- Oil pressure | CHECKED
- RPM 710 ± 30 | CHECKED
- Fuel selectors (2) | X-FEED
- Pitot heat | ON, annunciation + Amps checked
- Pitot heat | OFF
- Avionics master | ON
- WX radar (if installed) | VERIFY STBY
- FMS setup | COMPLETED
  ~ I – Initialize profile (AUX 4, MAP)
  ~ F – Flight plan
  ~ R – Radios (COM, NAV, ADF, DME, CDI, BRG 1/2, AUX, RAIM)
  ~ P – Performance (speed bugs; Flight ID if applicable)
- Autopilot test | COMPLETED
  ~ DISCONN press, check electric trim not working
  ~ AP ON, check annunciations and FD
  ~ DISCONN press, check AP off
  ~ GA button press, check FD commands climb
  ~ FD off
- Flood light | CHECKED, ON as required
- Position lights | ON as required
- Fuel selectors (2) | ON
- Altimeters (2) | SET
- Standby horizon | CHECKED
- Transponder | CODE / MODE CHECKED
- Engine temperatures | CHECKED
- Parking brake | RELEASED
! Max power 50 % until engine temperatures in green range`},
{id:"taxi",s:"N",g:"Ground",t:"During Taxi",src:`
. Brakes | CHECK
. Nose wheel steering | CHECK
. Flight instruments | CHECK`},
{id:"bef-to",s:"N",g:"Ground",t:"Before Take-off Check",src:`
- Parking brake | SET
- Seat belts | FASTENED
- Adjustable backrest | UPRIGHT
- Rear door | CLOSED + LATCHED
- Front canopy | CLOSED + LATCHED
- Front baggage doors | CHECKED CLOSED
- Door warning light | OFF
- Circuit breakers | CHECKED
- Electric elevator trim | CHECKED, T/O SET
- Fuel selectors (2) | CHECKED ON
- Rudder trim | AS REQUIRED
- Flaps | Normal T/O: UP · Short field: APP
- Flight controls | CHECKED
- Power levers (2) | IDLE
- MFD – EIS | ENGINE
- Engine instruments | CHECKED
! Engine temperatures must be in green range before performing ECU test (gearbox min 38 °C recommended). For warm-up max power 50 %.
- VOTER switches (2) | A, AUTO, B, AUTO
- ECU test (2) | PERFORMED
  . ECU test buttons (2) | PRESS and HOLD
  . "L/R ECU A/B FAIL" | ON
  . Props | CYCLING
  . "L/R ECU A/B FAIL" | OFF
  . ECU test button | RELEASE
- Pitot heat | AS REQUIRED
- *Ice protection | AS REQUIRED
- Transponder | CODE / MODE CHECKED
- Fuel pumps (2) | ON
- MFD – EIS | DEFAULT
- Parking brake | RELEASED`},
{id:"lineup",s:"N",g:"Flight",t:"Line Up Procedure",src:`
. Landing light | ON
. Approach sector | CLEAR
. Runway | IDENTIFIED
. Available power check | PERFORMED
@lim Available power check table (Limits)`},
{id:"aft-to",s:"N",g:"Flight",t:"After Take-off Procedure",src:`
. Brakes | APPLY
. Gear | UP
~ Alternate air: OPEN in rain, snow, visible moisture
> At safe altitude:
  . Flaps | UP
  . Climb power | 92 %`},
{id:"climb",s:"N",g:"Flight",t:"Climb to Cruise Check",src:`
- Gear | CHECKED UP
- Flaps | CHECKED UP
- Fuel pumps (2) | OFF
- Climb power | SET
- Alternate air | AS REQUIRED
- Landing light | OFF`},
{id:"descent",s:"N",g:"Flight",t:"Descent / Approach Check",src:`
- Landing data | RECEIVED
- Altimeters (2) | SET
- COM / NAV / FMS | SET
- Safety harnesses | FASTENED
- Adjustable backrests | UPRIGHT
- Parking brake | CHECKED RELEASED
- Rudder trim | AS REQUIRED
- Gear warning + lights | TEST
- Landing light | ON
> Normal approach:
  -10 Fuel selectors (2) | CHECKED ON
  -11 Fuel pumps (2) | ON
> 1 engine out approach:
  -10 Fuel selector (good engine) | CHECKED ON
  -11 Fuel pumps (good engine) | ON`},
{id:"final",s:"N",g:"Flight",t:"Final Check",src:`
- Flaps | LDG
- Gear | 3 GREENS CHECKED
- Rudder trim | NEUTRAL`},
{id:"ga",s:"N",g:"Flight",t:"Go-around Procedure",src:`
. Power | MAX
. Flaps | APP
> Positive rate of climb:
  . Gear | UP
  . Flaps | UP
~ Continue with take-off profile
> At safe altitude:
  . Climb power | 92 %`},
{id:"aft-ldg",s:"N",g:"After landing",t:"After Landing Check",sub:"When clear of runway",src:`
- Alternate air | CLOSED
- Pitot heat | OFF
- Flaps | UP
- Fuel pumps (2) | OFF
- *De-ice systems | OFF
- Landing/Taxi light | AS REQUIRED`},
{id:"parking",s:"N",g:"After landing",t:"Parking Check",src:`
- Parking brake | SET
- Power levers (2) | max 10 % for 1 min
- ELT | CHECK not activated
- MFD – EIS | ENGINE
- MFD – EIS | TTL TIME IN SVC NOTED
- Avionic master | OFF
- Electrical consumers except ACL (strobe) | OFF
- Engine masters (2) | OFF
- ACL (strobe) | OFF
~ When engine indications X-ed out:
- Electric master | OFF
- Interior light | CHECKED OFF
- Start key | REMOVED`},
{id:"secure",s:"N",g:"After landing",t:"Securing the Aircraft",src:`
. Chocks | USE
~ Consider parking brake released
. Pitot probe | COVER
. Tie-down ropes to mooring points | CONSIDER`},

/* ===================== EMERGENCY ===================== */
{id:"evac",s:"E",g:"Evacuation",t:"Evacuation",sub:"Conditions: Evacuation is needed",x:true,ft:"Source: Astonfly QRH V1.5 REV04 · p. 83",end:"END OF PROCEDURE",src:`
- Parking brake | SET
- Engine masters (2) | OFF
- ATC | ADVISED
- Electrical master | OFF
- Fuel pumps (2) | OFF
- Fuel selector | OFF
- Crew | EVACUATE`},
{id:"eng-out-ldg",s:"E",g:"Engines out",t:"Engines Out Landing",sub:"2 engines out",src:`
- Mayday call | CONSIDER
- Engine masters (2) | OFF
- Alternators (2) | OFF
- Fuel pumps (2) | OFF
- Fuel selectors (2) | OFF
- Avionic master | OFF
- Safety harnesses | FASTENED and TIGHT
~ When sure of making landing area:
- Flaps | APP or LDG, as required
- Approach speed | min 84 KIAS
- Power levers (2) | IDLE
> Gear UP landing – after touchdown:
  -11 Electric master | OFF
> Gear DOWN landing:
  -11 Gear | DOWN, 3 GREENS CHECKED
  -12 Electric master | OFF`},
{id:"w-amps",s:"E",g:"G1000 Warnings",t:"L/R ALTN AMPS",sub:"High current (red range)",src:`
. Check circuit breakers
. Reduce electrical load and land at nearest suitable airfield`},
{id:"oil-pres",s:"E",g:"G1000 Warnings",t:"L/R OIL PRES",sub:"Oil pressure low (red range)",src:`
. Reduce power on affected engine
. Be prepared for loss of oil and an engine failure; land at nearest suitable airfield`},
{id:"oil-temp",s:"E",g:"G1000 Warnings",t:"L/R OIL TEMP",sub:"Oil temperature high (red range)",src:`
. Check oil pressure
> If oil pressure too low (outside green range):
  . Reduce power on affected engine
  . Expect loss of engine oil
  . Be prepared for an engine failure
> If oil pressure in green range:
  . Reduce power on affected engine
  . Increase airspeed
  > If oil temperature not returning to green range:
    . Be prepared for an engine failure; land at nearest suitable airfield`},
{id:"gbox",s:"E",g:"G1000 Warnings",t:"L/R GBOX TEMP",sub:"Gearbox temperature high (red range)",src:`
. Reduce power on affected engine
. Increase airspeed
> If gearbox temperature still in red range:
  . Land at nearest suitable airfield
  . Be prepared for an engine failure`},
{id:"eng-temp",s:"E",g:"G1000 Warnings",t:"L/R ENG TEMP",sub:"Coolant temperature high (red range)",src:`
. Check G1000 for LOW COOL LVL caution light
> If LOW COOL LVL caution light OFF:
  > During climb:
    . Reduce power on affected engine by 10 % or more as required
    . Increase airspeed by 10 KIAS or more as required
    > If coolant temp. not returning to green range within 60 sec:
      . Reduce power on affected engine as much as possible and increase airspeed
  > During cruise:
    . Reduce power on affected engine
    . Increase airspeed
    > If coolant temp. not returning to green range:
      . Be prepared for an engine failure; land at nearest suitable airfield
> If LOW COOL LVL caution light ON:
  . Reduce power on affected engine
  . Expect loss of coolant fluid
  . Be prepared for an engine failure`},
{id:"fuel-temp",s:"E",g:"G1000 Warnings",t:"L/R FUEL TEMP",sub:"Fuel temperature high (red range)",src:`
. Reduce power on affected engine
. Increase airspeed
. Transfer fuel from AUX to MAIN tank if applicable
> If not returning to green range:
  . Land at nearest suitable airfield`},
{id:"fuel-pres",s:"E",g:"G1000 Warnings",t:"L/R FUEL PRES",sub:"Fuel pressure low",src:`
. Check fuel quantity
. FUEL SELECTOR of affected engine | CHECK ON
. FUEL PUMPS of affected engine | ON
> If warning remains:
  . FUEL PUMPS of affected engine | OFF
  . FUEL SELECTOR of affected engine | CROSSFEED
  > If warning still remains:
    . Be prepared for an engine failure`},
{id:"starter",s:"E",g:"G1000 Warnings",t:"L/R STARTER",sub:"Starter not disengaging",src:`
> On ground:
  . Affected power lever | IDLE
  . Affected engine master | OFF
  . Electric master | OFF
> In flight:
  . LDG LT/START CB (RH Main Bus) | PULL
  ~ Push again when LDG light needed
  . Watch engine cowling and instruments
  . Land at nearest suitable airfield`},
{id:"door",s:"E",g:"G1000 Warnings",t:"DOOR OPEN",sub:"Unlocked doors",src:`
. Reduce airspeed immediately
. Check canopy visually
> If open:
  . Airspeed below 140 KIAS, land at nearest suitable airfield
. Check rear door visually
> If open:
  . Airspeed below 140 KIAS, land at nearest suitable airfield
  ! Do not try to lock door in flight
. Check front baggage doors visually
> If one or both open:
  . Reduce airspeed to keep door(s) in stable position, land at nearest suitable airfield`},
{id:"eng-fire",s:"E",g:"G1000 Warnings",t:"L/R ENG FIRE",sub:"Engine fire – on ground, during take-off, in flight",src:`
~ G1000 warning L/R ENG FIRE or engine fire observed
> On ground:
  -1 Engine masters (2) | OFF
  -2 Fuel selectors (2) | OFF
  -3 Mayday call | CONSIDER
  -4 Electric master | OFF
  ~ When engine and aircraft stopped:
  -5 Canopy | OPEN
  . Evacuate
> During take-off:
  -1 Cabin heat & defrost | OFF
  -2 Emergency windows (2) | OPEN
  -3 Proceed according ENGINE FAILURE DURING TAKE-OFF
  @eng-fail-to Engine failure during take-off
> In flight (L/R ENG FIRE warning):
  . Evaluate the situation
  > If engine fire observed:
    @eng-fire-flt Engine fire in flight`},
{id:"eng-fail-to",s:"E",g:"Engine",t:"Engine Failure During Take-off",sub:"Rejected take-off or emergency re-landing",src:`
- Power | OFF
- Brakes | APPLY
- ATC | INFORM
> If necessary:
  -4 Engine masters (2) | OFF
  -5 Fuel selectors (2) | OFF
  -6 Electric master | OFF`},
{id:"eng-fail-flt",s:"E",g:"Engine",t:"Engine Failure in Flight",sub:"and engine shutdown",src:`
> If airspeed below VMCA:
  . Perform VMC recovery procedure
~ Airspeed above VMCA:
- Power | INCREASE up to MAX
- Airspeed | min BLUE LINE
- Landing gear | UP
- Flaps | UP
- Power lever (affected engine) | REDUCE TO VERIFY
- Engine master (affected engine) | OFF
~ Above safe altitude:
- Power (live engine) | up to MAX CONTINUOUS
- Alternator (dead engine) | OFF
- Fuel pumps (dead engine) | OFF
- Fuel selector (dead engine) | OFF`},
{id:"eng-trouble",s:"E",g:"Engine",t:"Engine Troubleshooting",src:`
> If L or R ECU A AND B FAIL simultaneously and ALL of the following exist: indicated LOAD unchanged · perceived thrust reduced · engine noise changes or engine running rough
  -1 POWER lever | IDLE for 1 second
  -2 POWER lever | slowly increase to 1975 RPM
  > If engine shows power loss during the POWER lever increase:
    -3 POWER lever | IDLE for 1 second
    -4 POWER lever | slowly increase
    ~ Stop prior to the RPM where former engine power loss was observed
  ! Do not increase the POWER lever past 1975 RPM or the setting determined in step 4. An increase beyond this setting leads into another power loss.
  ~ With this power setting the engine can provide up to 65 % at the maximum propeller speed of 1975 RPM.
  -5 Land at nearest suitable airfield
> Otherwise:
  -1 Power lever (good engine) | INCREASE up to MAX
  -2 Circuit breakers | CHECK/RESET
  > If engine OK: continue, land ASAP – end of checklist
  -3 VOTER switch | SWAP between A and B
  > If engine OK: continue, land ASAP – end of checklist
  -4 VOTER switch | AUTO
  > If engine OK: continue, land ASAP – end of checklist
  -5 Fuel pumps (affected engine) | CHECK OFF
  -6 Fuel selector (affected engine) | CROSSFEED
  > If engine OK: continue – end of checklist
  -7 Fuel selector (affected engine) | ON or CROSSFEED
  -8 Alternate air | OPEN
  > If engine OK: land as soon as practicable – end of checklist
  > If engine still not OK: be prepared for ENGINE FAILURE IN FLIGHT, land ASAP
  @eng-fail-flt Engine failure in flight`},
{id:"restart",s:"E",g:"Engine",t:"Engine Restart",src:`
! Reason for shutdown must be ascertained
%restart
- Power (affected engine) | IDLE
- Fuel selector (affected engine) | ON
- Alternate air | AS REQUIRED
- Alternator (affected engine) | ON
- Engine master (affected engine) | ON
> For restart with starter motor:
  -6 Starter | ENGAGE when prop stationary
  -7 Circuit breakers | CHECK/RESET if necessary
> If engine started:
  -8 Power (affected engine) | MODERATE
  -9 Engine instruments | check GREEN RANGE`},
{id:"osc-rpm",s:"E",g:"Engine",t:"Oscillating RPM",src:`
- Power lever | CHANGE SETTING
> If no success: check G1000 for ECU FAIL caution
  > If ECU FAIL caution indicated:
    -2 VOTER switch | unaffected ECU
    > If no success:
      -3 VOTER switch | AUTO
. Land at nearest suitable airfield`},
{id:"rpm-over",s:"E",g:"Engine",t:"RPM Overspeed",src:`
- Power setting | REDUCE
> If no success: check G1000 for ECU FAIL caution
  > If ECU FAIL caution indicated:
    -2 VOTER switch | unaffected ECU
    > If no success:
      -3 VOTER switch | AUTO
. Land at nearest suitable airfield
! Be prepared for ENGINE FAILURE IN FLIGHT
@eng-fail-flt Engine failure in flight`},
{id:"tire",s:"E",g:"Landing gear",t:"Landing with Defective Main Gear Tire",src:`
- ATC | INFORMED
~ For landing:
. Land on RWY side with "good" tire
. Keep wing on "good" side low
. Support directional control with brake`},
{id:"brakes",s:"E",g:"Landing gear",t:"Landing with Defective Brakes",src:`
> After touchdown (if necessary):
  -1 Engine masters (2) | OFF
  -2 Fuel selectors (2) | OFF
  -3 Electric master | OFF`},
{id:"gear-unsafe",s:"E",g:"Landing gear",t:"Landing Gear Unsafe Warning",src:`
~ If ON for more than 20 seconds:
- Airspeed | max 152 KIAS
> In cold temperature:
  -2 Airspeed | max 110 KIAS
-3 Gear selector | RECYCLE
> If landing gear extension unsuccessful:
  @gear-manual Continue with MANUAL EXTENSION
> If landing gear retraction unsuccessful:
  . Consider flight with landing gear down`},
{id:"gear-manual",s:"E",g:"Landing gear",t:"Manual Extension of Landing Gear",src:`
- Airspeed | max 152 KIAS
- Gear indicator lights | TEST
- Electric master | CHECK ON
- Bus voltage | CHECK NORMAL
- Circuit breaker | CHECK
- Gear selector | DOWN
- Manual extension handle | PULL
> If necessary:
  -8 Airspeed | max 110 KIAS
  . Apply moderate yawing
-9 Gear indicator lights | CHECK 3 GREENS`},
{id:"gear-up-ldg",s:"E",g:"Landing gear",t:"Landing Gear Up Landing",sub:"Landing gear completely retracted",src:`
- Approach | NORMAL
> If time/situation allows, just before touchdown:
  -2 Power lever | IDLE
  -3 Engine masters (2) | OFF
  -4 Fuel pumps (2) | OFF
  -5 Fuel selectors (2) | OFF
~ Immediately after touchdown:
-6 Electric master | OFF`},
{id:"eng-fire-flt",s:"E",g:"Smoke and fire",t:"Engine Fire in Flight",src:`
- Cabin heat & defrost | OFF
- Canopy | UNLATCH if necessary
! Max airspeed 117 KIAS
- Shut down the engine according ENGINE SHUTDOWN procedure
@eng-fail-flt Engine failure / shutdown in flight`},
{id:"eng-fire-gnd",s:"E",g:"Smoke and fire",t:"Engine Fire on Ground / during T/O",sub:"See L/R ENG FIRE",src:`
@eng-fire L/R ENG FIRE procedure`},
{id:"elec-fire-gnd",s:"E",g:"Smoke and fire",t:"Electrical Fire on Ground",src:`
- Mayday call | CONSIDER
- Electric master | OFF
- Power levers (2) | IDLE
- Engine masters (2) | OFF
- Fuel selectors (2) | OFF
~ When engine and aircraft stopped:
- Canopy | OPEN
. Evacuate`},
{id:"elec-fire-flt",s:"E",g:"Smoke and fire",t:"Electrical Fire in Flight",src:`
- Emergency switch | ON
- Mayday call | CONSIDER
- Avionic master | OFF
- Electric master | OFF
- Cabin heat & defrost | OFF
- Emergency windows | OPEN as necessary
- Canopy | UNLATCH if necessary
! Max airspeed 117 KIAS
. Land at nearest suitable airfield`},
{id:"smoke-10k",s:"E",g:"Smoke and fire",t:"Cabin Smoke above 10.000 ft",sub:"If oxygen system is installed",src:`
- Oxygen | CHECK ON
- Emergency descent | INITIATE
~ When passing 10.000 ft:
- Oxygen | OFF
. Land at nearest suitable airfield
@em-desc Emergency descent`},
{id:"fire-10k",s:"E",g:"Smoke and fire",t:"Cabin Fire above 10.000 ft",sub:"If oxygen system is installed",src:`
- Oxygen | PUSH OFF
- Emergency descent | INITIATE
. Land at nearest suitable airfield
@em-desc Emergency descent`},
{id:"oxy-loss",s:"E",g:"Smoke and fire",t:"Oxygen Pressure Loss above 10.000 ft",sub:"If oxygen system is installed",src:`
- Oxygen | PUSH OFF
- Oxygen pressure | CHECKED, note down
- Emergency descent | INITIATE
~ When passing 10.000 ft:
- Oxygen pressure | CHECK AGAIN
> If oxygen pressure constant: continue flight
> If oxygen pressure dropped: land at nearest suitable airfield
@em-desc Emergency descent`},
{id:"em-desc",s:"E",g:"Other emergencies",t:"Emergency Descent",src:`
- Flaps | UP
- Landing gear | DOWN
- Power levers | IDLE
- Airspeed | AS REQUIRED`},
{id:"icing",s:"E",g:"Other emergencies",t:"Unintentional Flight into Icing",sub:"Inadvertent icing encounter & excessive ice accumulation",src:`
~ Unintentional flight into icing: leave icing area, continue with item 1
- *De-ice system | HIGH + MAX
- Pitot heat | ON
- Cabin heat & defrost | ON
- Alternate air | OPEN
- *Windshield de-ice | USE AS APPROPRIATE
- Emergency windows | OPEN as required
> *When de-ice system does not work properly:
  @ice-fail Continue with ICE PROTECTION FAILURE`},
{id:"ice-fail",s:"E",g:"Other emergencies",t:"Ice Protection Failure",src:`
- Airspeed | 118 to 156 KIAS until final
- Flaps | limited to APP position
- Approach with residual ice | min 90/93 KIAS
- Landing distance | flaps LDG value + 20 %`},
{id:"co",s:"E",g:"Other emergencies",t:"Suspicion of Carbon Monoxide",src:`
- Cabin heat & defrost | OFF
- Ventilation | OPEN
- Emergency windows | OPEN
- Airspeed | max 117 KIAS
- Canopy | UNLATCH
~ Push up and lock in cooling gap position`},
{id:"elec-fail",s:"E",g:"Electrical system",t:"Complete Electrical Failure",src:`
~ * Leave icing area
- Circuit breakers | CHECK all IN
> If no success:
  -2 Emergency switch | ON
  -3 Flood light, if necessary | ON
  -4 Power | SET
  ~ According power lever position and/or engine noise
  -5 Flaps | VERIFY POSITION
. Land at nearest suitable airfield
! Landing gear may slowly extend
@gear-manual For landing apply MANUAL EXTENSION OF LANDING GEAR`},

/* ===================== ABNORMAL ===================== */
{id:"fuel-low",s:"A",g:"G1000 Cautions",t:"L/R FUEL LOW",sub:"Main tank fuel qty low",src:`
. Check fuel quantity
. Avoid uncoordinated flight
> If LH & RH quantities show remarkable difference:
  . Expect loss of fuel on side with lower indication
  . Check fuel pumps OFF
  . Use X-feed: fuel selector to X-FEED on side with LOW FUEL indication`},
{id:"aux-e",s:"A",g:"G1000 Cautions",t:"L/R AUX FUEL E",sub:"Auxiliary fuel tank empty",src:`
. L/R auxiliary fuel pump | OFF`},
{id:"ecu-gnd",s:"A",g:"G1000 Cautions",t:"L/R ECU A or B FAIL – On Ground",src:`
- VOTER switch | check AUTO
- Other ECU caution | check OFF
~ Clearing procedure:
- VOTER switch | set to failed ECU
~ Wait 5 seconds
- VOTER switch | AUTO
> If ECU caution persists: terminate flight preparation`},
{id:"ecu-flt",s:"A",g:"G1000 Cautions",t:"L/R ECU A or B FAIL – In Flight",src:`
~ In case of ECU fail the system automatically switches to the other ECU
- Alternate air | OPEN
- Fuel pumps LH/RH | ON
- Circuit breakers | CHECK/RESET if necessary
- VOTER switch | check AUTO
> If ECU caution persists, ECU caution clearing procedure may be used:
  ! BUT: in case of negative 1-engine climb rate only if a suitable landing site is available within gliding distance. Be prepared for loss of engine power.
  -5 Safe altitude | CHECK
  -6 Airspeed | min 85 KIAS
  -7 Flaps | check UP
  -8 Landing gear | check UP
  -9 Other ECU caution | check OFF
  -10 VOTER switch | set to failed ECU
  ~ Wait 5 seconds
  -11 VOTER switch | AUTO
  > If ECU caution persists:
    . Land at nearest suitable airfield
  > If additional engine problems are observed:
    @eng-trouble Engine troubleshooting
> L or R ECU A FAIL and ECU B FAIL simultaneously:
  @eng-trouble Go to ENGINE TROUBLESHOOTING`},
{id:"volts-low-c",s:"A",g:"G1000 Cautions",t:"L/R VOLTS LOW",sub:"Bus voltage too low",src:`
~ Possible reasons: fault in the electrical power supply; alternators OFF
@ind-volts Continue with VOLTS low`},
{id:"altn-fail",s:"A",g:"G1000 Cautions",t:"L/R ALTN FAIL",sub:"Alternator failed",src:`
> If in icing conditions:
  . Leave icing area as soon as practicable
. Alternator on affected side | OFF
. Monitor bus voltage
. Reduce electrical consumers
> If both alternators failed:
  @altn-both Both alternators failed`},
{id:"altn-both",s:"A",g:"G1000 Cautions",t:"L + R ALTN FAIL",sub:"Both alternators failed",src:`
~ Reduce all electrical equipment to a minimum:
. Avionic master | OFF
. LH/RH alternator | OFF
. Transponder | STBY
. Gear | DOWN
> When down and locked:
  . Manual gear extension handle | PULL
. Stall/Pitot heat | OFF
. All lights | OFF
! Expect battery power to last for 30 minutes. Expect engine stoppage after this time.
. Land ASAP`},
{id:"stick",s:"A",g:"G1000 Cautions",t:"STICK LIMIT",sub:"Variable elevator stop system failed",src:`
> 1 or 2 power levers set for MORE than 20 % load:
  ! Elevator variable stop is INOP. Do not stall in any configuration!
> 2 power levers set for LESS than 20 % load:
  ~ Elevator variable stop always ACTIVE – reduced elevator capacity
  . For approach min VREF 86 KIAS`},
{id:"cool-lvl",s:"A",g:"G1000 Cautions",t:"L/R COOL LVL",sub:"Engine coolant level low",src:`
. Monitor annunciations / engine instruments
. Check coolant temperature
@ind-cool-hi See COOLANT temperature (green range)`},
{id:"pitot",s:"A",g:"G1000 Cautions",t:"PITOT / STALL HT FAIL or OFF",sub:"PITOT FAIL · PITOT HT OFF · STALL HT FAIL · STALL HT OFF",src:`
. Check pitot heat ON, if in icing conditions
~ PITOT: expect loss of airspeed indication
~ STALL HT: expect loss of aural stall warning
. Leave area with icing conditions
@icing Unintentional flight into icing`},
{id:"deice-lvl",s:"A",g:"G1000 Cautions",t:"DEICE LVL LO",sub:"De-icing fluid level low",src:`
! Maximum duration of ice protection: NORMAL mode 30 min, HIGH mode 15 min`},
{id:"deic-pres-lo",s:"A",g:"G1000 Cautions",t:"DEIC PRES LO",sub:"De-icing pressure low",src:`
. DE-ICE | HIGH
> If DEIC PRES LO light still ON:
  . PUMP 1 / PUMP 2 | SELECT OTHER PUMP
  ~ If necessary prime pump by activating windshield pump
  > If DEIC PRES LO light still ON:
    . ALTERNATE switch | ACTIVATE
    > If DEIC PRES LO light still ON:
      @ice-fail Go to ICE PROTECTION FAILURE
> If DEIC PRES LO light OFF:
  . Continue flight (de-icing fluid flow: 30 l/h)
  . Monitor ice protection system operation
  . Check de-icing fluid level periodically`},
{id:"deic-pres-hi",s:"A",g:"G1000 Cautions",t:"DEIC PRES HI",sub:"De-icing pressure high",src:`
~ Possible reduced system performance
~ Filter cartridge to be replaced at next scheduled maintenance`},
{id:"ind-cool-hi",s:"A",g:"Engine indications outside green range",t:"COOLANT Temperature High / Low",src:`
= Coolant temperature high
@eng-temp Refer to L/R ENG TEMP
= Coolant temperature low
~ During low power descent from high altitude coolant temperature may decrease. Consider increasing power.
. Check G1000 for LOW COOLANT LVL caution light
> If LOW COOLANT LVL caution light ON:
  . Reduce power on affected engine
  . Expect loss of coolant fluid
  . Be prepared for an engine failure`},

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(src){
  const out=[]; let n=0; const condAt=[];
  for(const raw of src.split("\n")){
    if(!raw.trim()) continue;
    const ind=(raw.match(/^ */)[0].length)>>1; const line=raw.trim();
    condAt.length=Math.min(condAt.length,ind);
    const inCond=condAt.some(Boolean);
    const node={lvl:ind,cond:inCond};
    let m;
    if((m=line.match(/^-(\d+)?\s+(.*)$/))){ node.ty="i"; if(m[1]) n=+m[1]; else n++; node.no=n; body(node,m[2]); }
    else if(line.startsWith(". ")){ node.ty="i"; body(node,line.slice(2)); }
    else if(line.startsWith("> ")){ node.ty="c"; node.text=line.slice(2); condAt[ind]=true; }
    else if(line.startsWith("~ ")){ node.ty="n"; node.text=line.slice(2); }
    else if(line.startsWith("! ")){ node.ty="w"; node.text=line.slice(2); }
    else if(line.startsWith("= ")){ node.ty="h"; node.text=line.slice(2); }
    else if(line.startsWith("@")){ const sp=line.indexOf(" "); node.ty="l"; node.to=line.slice(1,sp); node.text=line.slice(sp+1); }
    else if(line.startsWith("%")){ node.ty="t"; node.tab=line.slice(1); }
    else { node.ty="n"; node.text=line; }
    out.push(node);
  }
  return out;
}
function body(node,s){
  let opt=""; const m=s.match(/^(\*\*|\*)\s*/); if(m){opt=m[1]; s=s.slice(m[0].length);}
  const p=s.split(" | "); node.c=p[0]; node.r=p[1]||""; node.opt=opt;
}

  h+=`<h2>Manoeuvring speed (VO)</h2><div class="tblw"><table><thead><tr>${L.vo.map(r=>`<th class="plain">up to ${r[0]}</th>`).join("")}</tr></thead><tbody><tr>${L.vo.map(r=>v(r[1])).join("")}</tr></tbody></table></div>`;
  h+=`<div class="tblw"><table><thead><tr><th class="mass" colspan="2">MASS</th></tr></thead><tbody>`+L.mass.map(r=>`<tr><td class="pink">${r[0]}</td><td class="v pink">${r[1]}</td></tr>`).join("")+`<tr><td class="pink">Max. baggage in NOSE</td><td class="v pink">30 kg</td></tr><tr><td class="pink">Max. baggage in COCKPIT</td><td class="v pink">45 kg</td></tr><tr><td class="pink">Max. baggage in rear EXTENSION</td><td class="v pink">18 kg</td></tr><tr><td class="pink">COCKPIT + rear EXTENSION together</td><td class="v pink">45 kg</td></tr></tbody></table></div><p>"Ice": ice accumulation and/or icing conditions.</p>`;
  h+=`<h2>Available power check</h2><p>10 sec power MAX, RPM 2250 – 2300, minimum load according to the table below.</p><div class="tblw"><table><thead><tr><th class="plain">Altitude [ft]</th>${POWER.temps.map(t=>`<th class="plain">${t} °C</th>`).join("")}</tr></thead><tbody>`+POWER.rows.map(r=>`<tr><td class="plain"><b>${r[0]}</b></td>${r.slice(1).map(x=>`<td class="v plain">${x==="–"?"–":x+" %"}</td>`).join("")}</tr>`).join("")+`</tbody></table></div>`;
  h+=footNote+`</article>`;
  return h;
}
function renderAfm(){
  let h=limHead("Operating Limitations","DA 42 NG Airplane Flight Manual, Doc. 7.01.16-E, Rev. 5 (10-Jun-2021), Chapter 2");
  h+=`<h2>Engine instrument markings (2.5)</h2><div class="tblw"><table><thead><tr><th class="plain">Indication</th><th class="plain r1">Red<br>low</th><th class="plain y1">Yellow</th><th class="plain g1">Green<br>normal</th><th class="plain y1">Yellow</th><th class="plain r1">Red<br>high</th></tr></thead><tbody>`+
    AFM_MARK.map(r=>`<tr><td>${r[0]}</td>${v(r[1])}${v(r[2])}${v(r[3])}${v(r[4])}${v(r[5])}</tr>`).join("")+`</tbody></table></div><p>* Fuel temp: G1000 software P/N 010-00670-12 or later. Earlier software: yellow −30 to −20 °C, green −20 to 55 °C.</p>`;
  h+=`<h2>Power plant limitations (2.4)</h2><div class="tblw"><table><tbody>`+AFM_ENG.map(r=>`<tr><td>${r[0]}</td>${v(r[1])}</tr>`).join("")+`</tbody></table></div>`;
  h+=`<h2>Airspeed indicator markings (2.3)</h2><div class="tblw"><table><tbody><tr><td>White arc – flaps fully extended</td>${v("62 – 113 (64 – 113 MÄM 42-678)")}</tr><tr><td>Green arc – normal operating range</td>${v("68 – 151 (72 – 151 MÄM 42-678)")}</tr><tr><td>Yellow arc – caution, smooth air only</td>${v("151 – 188")}</tr><tr><td>Blue radial – VYSE</td>${v("85")}</tr><tr><td>Red radial – VMCA</td>${v("71")}</tr><tr><td>Red radial – VNE</td>${v("188")}</tr></tbody></table></div>`;
  h+=`<h2>Fuel (2.14)</h2><div class="tblw"><table><thead><tr><th class="plain"></th><th class="plain">Total capacity</th><th class="plain">Usable</th></tr></thead><tbody>`+AFM_FUEL.map(r=>`<tr><td>${r[0]}</td>${v(r[1])}${v(r[2])}</tr>`).join("")+`</tbody></table></div>`;
  h+=`<h2>Centre of gravity (2.8)</h2><div class="tblw"><table><thead><tr><th class="plain">Limit</th><th class="plain">Aft of datum</th><th class="plain">Mass</th></tr></thead><tbody>`+AFM_CG.map(r=>`<tr><td>${r[0]}</td>${v(r[1])}${v(r[2])}</tr>`).join("")+`</tbody></table></div><p>Linear variation between the points.</p>`;
  h+=`<h2>Other limitations</h2><div class="tblw"><table><tbody>`+AFM_MISC.map(r=>`<tr><td>${r[0]}</td><td class="v" style="white-space:normal">${esc(r[1])}</td></tr>`).join("")+`</tbody></table></div>`;
  h+=`<p class="src">Always check against the AFM revision and supplements applicable to your aircraft (MÄM / OÄM status).</p>`+footNote+`</article>`;
  return h;
}
/* Limitations: all pages side by side, swipe left/right to change page. */
const LIMRENDER={lim:renderLim,afm:renderAfm};
function renderLimSwipe(){
  const i=Math.max(0,LIMPAGES.findIndex(x=>x.id===st.open));
  let h=`<div class="pager" role="tablist">`+LIMPAGES.map((x,k)=>`<button data-pg="${k}" aria-selected="${k===i}">${esc(x.t.replace(/ –.*/,""))}</button>`).join("")+`</div>`;
  h+=`<div class="swipe" id="swipe">`+LIMPAGES.map(x=>`<div class="slide">${LIMRENDER[x.id]()}</div>`).join("")+`</div>`;
  view.innerHTML=h;
  const sw=$("#swipe");
  sw.scrollLeft=i*sw.clientWidth; fitSwipe(i);
  let tm=null;
  sw.addEventListener("scroll",()=>{ clearTimeout(tm); tm=setTimeout(()=>{
    const k=Math.round(sw.scrollLeft/sw.clientWidth); fitSwipe(k);
    if(LIMPAGES[k]&&LIMPAGES[k].id!==st.open){ st.open=LIMPAGES[k].id; renderIndex(); document.querySelectorAll(".pager button").forEach((b,j)=>b.setAttribute("aria-selected",String(j===k))); }
  },90); },{passive:true});
}
function fitSwipe(k){ const sw=$("#swipe"); if(!sw) return; const sl=sw.children[k]; if(sl) sw.style.height=sl.scrollHeight+"px"; }
function goPage(k){ const sw=$("#swipe"); if(!sw) return; sw.style.height=""; sw.scrollTo({left:k*sw.clientWidth,behavior:"smooth"}); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- NAVIGATION ---------- */
function open(id){
  const k=LIMPAGES.findIndex(x=>x.id===id); if(k>=0&&$("#swipe")&&main.classList.contains("reading")){ goPage(k); return; }
  st.open=id; st.undo=null; main.classList.add("reading"); $("#back").hidden=false; revealGroup(id);
  if(byId[id]){ if(!byId[id].x){ st.tab=byId[id].s; store.set("tab",st.tab); } } else { st.tab="L"; }
  renderIndex(); renderView(); window.scrollTo(0,0); wake();
}
function closeView(){ st.open=null; st.undo=null; main.classList.remove("reading"); $("#back").hidden=true; renderIndex(); renderView(); window.scrollTo(0,0); }

function rerender(){ const y=window.scrollY; renderView(); renderIndex(); window.scrollTo(0,y); }
function toggle(i){
  const s=done[st.open]; s.has(i)?s.delete(i):s.add(i); saveDone(st.open); st.undo=null;
  rerender(); scrollActive();
}
function scrollActive(){
  const a=view.querySelector(".it.act"); if(!a) return;
  const r=a.getBoundingClientRect(); const hh=$("#hdr").getBoundingClientRect().bottom; const fb=window.innerHeight-130;
  if(r.top<hh+10||r.bottom>fb) window.scrollBy({top:r.top-(hh+(fb-hh)/3),behavior:"smooth"});
}
/* RESET: one tap clears the open checklist. RESET ALL: one tap clears every checklist in all three sections. */
function doReset(){ const id=st.open; done[id].clear(); saveDone(id); renderView(); renderIndex(); window.scrollTo(0,0); }
function doResetAll(){
  CL.forEach(c=>{ done[c.id].clear(); saveDone(c.id); });
  renderView(); renderIndex();
  const b=$("#resetall"); if(b){ b.classList.add("ok"); b.textContent="✓ ALL CHECKLISTS RESET"; setTimeout(()=>{ const x=$("#resetall"); if(x){ x.classList.remove("ok"); x.textContent="RESET ALL CHECKLISTS"; } },2000); }
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-i]"); if(!t) return;
  if(t.dataset.t){ st.tab=t.dataset.t; st.q=""; $("#q").value=""; store.set("tab",st.tab); renderIndex(); if(window.innerWidth<900&&st.open) closeView(); return; }
  if(t.dataset.g){ toggleGroup(t.dataset.g); return; }
  if(t.dataset.id){ open(t.dataset.id); return; }
  if(t.dataset.go){ open(t.dataset.go); return; }
  if(t.dataset.lim){ st.lim=t.dataset.lim; store.set("lim",st.lim); st.open="lim"; renderView(); return; }
  if(t.dataset.pg!=null){ goPage(+t.dataset.pg); return; }
  if(t.dataset.i!=null){ toggle(+t.dataset.i); return; }
  if(t.id==="next"){ const a=activeIdx(byId[st.open]); if(a>=0) toggle(a); return; }
  if(t.id==="reset"){ doReset(); return; }
  if(t.id==="resetall"){ doResetAll(); return; }
  if(t.id==="toidx"||t.id==="back"){ closeView(); return; }
  if(t.id==="theme"){ cycleTheme(); return; }
});
document.addEventListener("keydown",e=>{ const t=e.target.closest&&e.target.closest("[data-i]"); if(t&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); toggle(+t.dataset.i);} });
$("#q").addEventListener("input",e=>{ st.q=e.target.value; renderIndex(); if(st.q&&window.innerWidth<900&&st.open){ st.open=null; main.classList.remove("reading"); $("#back").hidden=true; renderView(); } });

/* ---------- THEME ---------- */
function curTheme(){ return document.documentElement.getAttribute("data-theme")||"light"; }
function applyTheme(){ const t=store.get("theme",null); if(t) document.documentElement.setAttribute("data-theme",t); $("#theme").textContent=curTheme()==="dark"?"JOUR":"NUIT"; }
function cycleTheme(){ store.set("theme",curTheme()==="dark"?"light":"dark"); applyTheme(); }

/* ---------- SCREEN WAKE LOCK ---------- */
let wl=null; async function wake(){ try{ if("wakeLock" in navigator && !wl){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>wl=null);} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&st.open) wake(); });

function hh(){ document.documentElement.style.setProperty("--hh",$("#hdr").offsetHeight+"px"); }
window.addEventListener("resize",()=>{ hh(); const sw=$("#swipe"); if(sw){ const k=LIMPAGES.findIndex(x=>x.id===st.open); sw.scrollLeft=k*sw.clientWidth; fitSwipe(k);} }); window.addEventListener("orientationchange",()=>setTimeout(hh,300));
try{ new ResizeObserver(hh).observe($("#hdr")); }catch(e){}

applyTheme(); renderIndex(); renderView(); hh();
if(window.innerWidth>=900) open("bef-start");
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
